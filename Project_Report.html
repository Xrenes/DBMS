<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DBMS Lab Project Report — University Academic Management System</title>
<style>
/* ── Page setup (A4) ── */
@page {
  size: A4 portrait;
  margin: 2.54cm 2.54cm 2.54cm 2.86cm;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Times New Roman', Times, serif;
  font-size: 12pt;
  line-height: 1.8;
  color: #000;
  background: #fff;
}

/* ── Sections / Chapters ── */
.chapter-section {
  page-break-before: always;
  padding: 0 0 30px 0;
}
.chapter-section:first-child { page-break-before: avoid; }

/* ── Headings ── */
h1.chapter-title {
  font-size: 16pt;
  font-weight: bold;
  text-align: center;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  border-top: 3px solid #000;
  border-bottom: 3px solid #000;
  padding: 10px 0;
  margin: 0 0 24px 0;
}
h2 {
  font-size: 13pt;
  font-weight: bold;
  margin: 22px 0 8px 0;
  color: #000;
}
h2.section-num::before { content: attr(data-num) " "; }
h3 {
  font-size: 12pt;
  font-weight: bold;
  margin: 16px 0 6px 0;
}
h4 {
  font-size: 12pt;
  font-weight: bold;
  font-style: italic;
  margin: 12px 0 4px 0;
}

/* ── Body text ── */
p { text-align: justify; margin: 6px 0 8px 0; }
ul, ol { padding-left: 28px; margin: 6px 0 10px 0; }
li { margin: 3px 0; text-align: justify; }
strong { font-weight: bold; }

/* ── Tables ── */
table {
  border-collapse: collapse;
  width: 100%;
  margin: 10px 0 16px 0;
  font-size: 10.5pt;
}
th, td {
  border: 1px solid #222;
  padding: 6px 9px;
  text-align: left;
  vertical-align: top;
}
th {
  background: #d0d0d0;
  font-weight: bold;
  text-align: center;
}
td.center { text-align: center; }
caption {
  font-weight: bold;
  font-size: 11pt;
  margin-bottom: 5px;
  text-align: center;
  font-style: italic;
  caption-side: top;
}

/* ── Code / SQL blocks ── */
pre {
  background: #f4f4f4;
  border: 1px solid #bbb;
  border-left: 4px solid #555;
  padding: 10px 14px;
  font-family: 'Consolas', 'Courier New', monospace;
  font-size: 9pt;
  white-space: pre-wrap;
  word-wrap: break-word;
  margin: 8px 0 14px 0;
  line-height: 1.5;
  page-break-inside: avoid;
}
code {
  font-family: 'Consolas', 'Courier New', monospace;
  font-size: 10pt;
  background: #efefef;
  padding: 1px 4px;
  border-radius: 2px;
}

/* ── Screenshot / image placeholder ── */
.img-placeholder {
  border: 2px dashed #666;
  background: #fafafa;
  min-height: 180px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  margin: 10px 0 16px 0;
  padding: 20px 16px;
  color: #444;
  page-break-inside: avoid;
  font-size: 10pt;
}
.img-placeholder .img-icon { font-size: 32px; margin-bottom: 8px; color: #888; }
.img-placeholder .img-filename {
  font-family: 'Consolas', 'Courier New', monospace;
  font-size: 9.5pt;
  background: #e0e0e0;
  padding: 2px 8px;
  border-radius: 3px;
  margin: 4px 0;
  color: #222;
}
.img-placeholder .img-desc { font-style: italic; color: #666; font-size: 9.5pt; margin-top: 4px; }
.img-caption {
  text-align: center;
  font-style: italic;
  font-size: 10pt;
  margin: -8px 0 14px 0;
  color: #333;
}

/* ── Info boxes ── */
.info-box {
  background: #eef4ff;
  border-left: 5px solid #1a5fa8;
  padding: 10px 14px;
  margin: 10px 0;
  font-size: 11pt;
}
.warning-box {
  background: #fffbe6;
  border-left: 5px solid #d4a017;
  padding: 10px 14px;
  margin: 10px 0;
  font-size: 11pt;
}
.success-box {
  background: #edfbf0;
  border-left: 5px solid #1b8a3e;
  padding: 10px 14px;
  margin: 10px 0;
  font-size: 11pt;
}

/* ── Contribution role badges ── */
.role-badge {
  display: inline-block;
  padding: 1px 8px;
  border-radius: 10px;
  font-size: 9.5pt;
  font-weight: bold;
  color: #fff;
}
.role-lead    { background: #1a5fa8; }
.role-fe      { background: #6a3d9b; }
.role-be      { background: #e56417; }
.role-db      { background: #1b8a3e; }
.role-sec     { background: #c0392b; }
.role-auth    { background: #2980b9; }

/* ── Query label ── */
.query-label {
  background: #222;
  color: #fff;
  font-family: 'Consolas', 'Courier New', monospace;
  font-size: 9.5pt;
  padding: 4px 10px;
  margin-bottom: -1px;
  display: inline-block;
  border-radius: 3px 3px 0 0;
}
.query-purpose {
  font-style: italic;
  color: #444;
  margin: 0 0 4px 0;
  font-size: 11pt;
}

/* ── EP tag ── */
.ep-tag {
  display: inline-block;
  background: #1a5fa8;
  color: #fff;
  font-size: 9pt;
  font-weight: bold;
  padding: 1px 7px;
  border-radius: 3px;
  margin-left: 6px;
  vertical-align: middle;
}

/* ── Horizontal rule ── */
hr { border: none; border-top: 1.5px solid #aaa; margin: 20px 0; }

/* ── Print media ── */
@media print {
  .chapter-section { page-break-before: always; }
  .chapter-section:first-child { page-break-before: avoid; }
  pre  { font-size: 8.5pt; }
  table { font-size: 9.5pt; }
  .img-placeholder { min-height: 130px; }
  body { font-size: 11.5pt; }
}
</style>
</head>
